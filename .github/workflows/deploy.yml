name: Deploy to Azure

# Pipeline strategy:
#   push to feature/**          -> build + test -> deploy DEV
#   pull_request targeting main -> build + test (status check for branch protection)
#   push to main                -> build + test -> deploy DEV -> deploy PROD
#
# Direct push to main is blocked by branch protection rules.
# OIDC authentication — no long-lived publish passwords.
#
# GitHub Environments 'dev' and 'prod' each carry:
#   - AZURE_WEBAPP_NAME (app-sporthalle-sulzerallee-dev / app-sporthalle-sulzerallee)
#   - Federated credential subject (repo:haugjan/sporthalle-sulzerallee:environment:<env>)
#
# Repository secrets (shared across both environments):
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for the runner to request an OIDC token
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: |
          dotnet restore src/SporthalleWeb/SporthalleWeb.csproj
          dotnet restore src/SporthalleWeb.Tests/SporthalleWeb.Tests.csproj

      - name: Build
        run: dotnet build src/SporthalleWeb/SporthalleWeb.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test src/SporthalleWeb.Tests/SporthalleWeb.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish
        if: github.event_name == 'push'
        run: dotnet publish src/SporthalleWeb/SporthalleWeb.csproj --configuration Release --output ./publish --no-build

      - name: Package
        if: github.event_name == 'push'
        run: cd ./publish && zip -r ../app.zip . && cd ..

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip
          retention-days: 3

  deploy-dev:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: dev
    # Serialize writes to the DEV app — queue instead of cancel so an in-flight
    # az webapp deploy is never interrupted mid-extraction.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy --resource-group Sporthalle-Sulzerallee --name "$WEBAPP" \
            --src-path app.zip --type zip --track-status false --timeout 600000

      - name: Warm up the site
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          BASE="https://$WEBAPP.azurewebsites.net"
          for i in $(seq 1 40); do
            S=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 120 "$BASE/" || echo "000")
            echo "Attempt $i: GET / -> $S"
            case "$S" in [2-5]*) echo "Up (HTTP $S)."; exit 0 ;; esac
            sleep 15
          done
          echo "App did not respond within the warm-up window (best-effort)."; exit 0

  deploy-prod:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    # Same queueing as dev: only one PROD deploy writes at a time, never cancelled mid-write.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy --resource-group Sporthalle-Sulzerallee --name "$WEBAPP" \
            --src-path app.zip --type zip --track-status false --timeout 600000

      - name: Warm up the site
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          BASE="https://$WEBAPP.azurewebsites.net"
          for i in $(seq 1 40); do
            S=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 120 "$BASE/" || echo "000")
            echo "Attempt $i: GET / -> $S"
            case "$S" in [2-5]*) echo "Up (HTTP $S)."; exit 0 ;; esac
            sleep 15
          done
          echo "App did not respond within the warm-up window (best-effort)."; exit 0
