name: Deploy to Azure

# Two-stage deploy (Switzerland North), Microsoft Entra / OIDC — no basic auth,
# no long-lived publish password.
#
#   push to feature/**  -> build + test -> deploy DEV
#   push to main        -> build + test -> deploy DEV -> deploy PROD
#
# GitHub Environments 'dev' and 'prod' each carry a per-environment variable
# AZURE_WEBAPP_NAME (app-sporthalle-sulzerallee-dev / app-sporthalle-sulzerallee)
# and match the OIDC federated-credential subjects:
#   repo:haugjan/sporthalle-sulzerallee:environment:dev
#   repo:haugjan/sporthalle-sulzerallee:environment:prod
#
# Repository secrets (same app registration for both environments):
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  id-token: write   # required for the runner to request an OIDC token
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: |
          dotnet restore src/SporthalleWeb/SporthalleWeb.csproj
          dotnet restore src/SporthalleWeb.Tests/SporthalleWeb.Tests.csproj

      - name: Build
        run: dotnet build src/SporthalleWeb/SporthalleWeb.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test src/SporthalleWeb.Tests/SporthalleWeb.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish
        run: dotnet publish src/SporthalleWeb/SporthalleWeb.csproj --configuration Release --output ./publish --no-build

      - name: Package
        run: cd ./publish && zip -r ../app.zip . && cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip
          retention-days: 3

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    # Serialize all writes to the DEV app across branches (feature/** and main both deploy here).
    # Queue instead of cancel: never interrupt an in-flight az webapp deploy, which could leave
    # the App Service with a half-extracted zip. A newer run waits; a still-pending run is replaced.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy --resource-group Sporthalle-Sulzerallee --name "$WEBAPP" \
            --src-path app.zip --type zip --track-status false --timeout 600000

      - name: Warm up the site
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          BASE="https://$WEBAPP.azurewebsites.net"
          for i in $(seq 1 40); do
            S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$BASE/" || echo "000")
            echo "Attempt $i: GET / -> $S"
            case "$S" in 2*|3*) echo "Up."; exit 0 ;; esac
            sleep 15
          done
          echo "App did not respond within the warm-up window (best-effort)."; exit 0

  deploy-prod:
    needs: [build, deploy-dev]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    # Same queueing as dev: only one PROD deploy writes at a time, never cancelled mid-write.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deploy --resource-group Sporthalle-Sulzerallee --name "$WEBAPP" \
            --src-path app.zip --type zip --track-status false --timeout 600000

      - name: Warm up the site
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          BASE="https://$WEBAPP.azurewebsites.net"
          for i in $(seq 1 40); do
            S=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$BASE/" || echo "000")
            echo "Attempt $i: GET / -> $S"
            case "$S" in 2*|3*) echo "Up."; exit 0 ;; esac
            sleep 15
          done
          echo "App did not respond within the warm-up window (best-effort)."; exit 0
